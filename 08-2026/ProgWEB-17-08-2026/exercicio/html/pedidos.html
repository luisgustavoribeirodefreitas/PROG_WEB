<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" required><br><br>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required><br><br>

        <label for="pizza">Escolha sua pizza:</label>
        <select id="pizza" name="pizza">
            <option value="margherita">Pizza Margherita</option>
            <option value="pepperoni">Pizza Pepperoni</option>
            <option value="calabresa">Pizza Calabresa</option>
            <option value="quatro_queijos">Pizza Quatro Queijos</option>
            <option value="portuguesa">Pizza Portuguesa</option>
            <option value="frango_catupiry">Pizza Frango com Catupiry</option>
        </select><br><br>

        <input type="submit" value="Enviar Pedido">
        <a href="../index.html">Voltar</a>
    
</body>
</html>
