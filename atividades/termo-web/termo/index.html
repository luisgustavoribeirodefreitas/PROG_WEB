<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Palavras - TERMO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="jogo">
    <header class="cabecalho"><h1>TERMO</h1></header>
    <section class="tabuleiro" aria-label="Tabuleiro com seis tentativas">
      <div class="linha"><div class="celula incorreta">P</div><div class="celula correta">E</div><div class="celula incorreta">D</div><div class="celula posicao-errada">R</div><div class="celula incorreta">A</div></div>
      <div class="linha"><div class="celula selecionada"></div><div class="celula"></div><div class="celula"></div><div class="celula"></div><div class="celula"></div></div>
      <div class="linha"><div class="celula"></div><div class="celula"></div><div class="celula"></div><div class="celula"></div><div class="celula"></div></div>
      <div class="linha"><div class="celula"></div><div class="celula"></div><div class="celula"></div><div class="celula"></div><div class="celula"></div></div>
      <div class="linha"><div class="celula"></div><div class="celula"></div><div class="celula"></div><div class="celula"></div><div class="celula"></div></div>
      <div class="linha"><div class="celula"></div><div class="celula"></div><div class="celula"></div><div class="celula"></div><div class="celula"></div></div>
    </section>
    <section class="teclado" aria-label="Teclado virtual ilustrativo">
      <div class="linha-teclado"><button class="tecla">Q</button><button class="tecla">W</button><button class="tecla correta">E</button><button class="tecla posicao-errada">R</button><button class="tecla">T</button><button class="tecla">Y</button><button class="tecla">U</button><button class="tecla">I</button><button class="tecla">O</button><button class="tecla incorreta">P</button></div>
      <div class="linha-teclado"><button class="tecla incorreta">A</button><button class="tecla">S</button><button class="tecla incorreta">D</button><button class="tecla">F</button><button class="tecla">G</button><button class="tecla">H</button><button class="tecla">J</button><button class="tecla">K</button><button class="tecla">L</button></div>
      <div class="linha-teclado"><button class="tecla">Z</button><button class="tecla">X</button><button class="tecla">C</button><button class="tecla">V</button><button class="tecla">B</button><button class="tecla">N</button><button class="tecla">M</button></div>
    </section>
  </main>
</body>
</html>
