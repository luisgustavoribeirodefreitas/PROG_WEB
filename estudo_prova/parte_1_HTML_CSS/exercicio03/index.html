<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <header>
        <h1>
            Formulário de cadastro
        </h1>
        <p>
            Preencha o formulário para participar
        </p>
    </header>
    <main>
        <section>
            <form action="">
                <p>
                    <label for="nome">Nome:</label>
                    <input type="text" name="nome" id="nome" placeholder="Digite seu nome">
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="" placeholder="Digite seu email">
                </p>
                <p>
                    <label for="idade">Idade:</label>
                    <input type="number" name="idade" id="" placeholder="Coloque sua idade">
                </p>
                <p>
                    <label for="curso">Curso:</label>
                    <input type="text" name="curso" id="" placeholder="Digite seu curso">
                </p>
                <button type="submit"> Cadastrar </button>
            </form>
        </section>
        <section>


        </section>
    </main>
    <footer>
        Direitos do evento reservados para Luis
    </footer>
</body>

</html>
